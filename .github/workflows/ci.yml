name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Smoke test render path
        run: bun run preview --screen overview --width 140
      - run: bun run build
      - name: Smoke test the compiled binary
        timeout-minutes: 2
        run: ./dist/open-usage --help
